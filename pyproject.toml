[project]
name = "measuring-replication-ram-skill"
version = "0.1.0"
description = "Agent skill for measuring and documenting the peak RAM of research replication packages."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["psutil>=5.9"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=measure_ram --cov-report=term-missing --cov-fail-under=80"
